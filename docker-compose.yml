version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Forward any public build-time env vars here
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    image: deep-agents-ui:local
    container_name: deep-agents-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    # Runtime secrets loaded from .env — never committed to git
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
